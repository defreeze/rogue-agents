[project]
name = "rogue-agents"
version = "0.1.0"
description = "A small multi-agent system that misbehaves on purpose, and the safeguards that contain it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
rogue = "rogue_agents.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
